name: Publish Wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-wiki
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Clone wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git clone \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" \
              .wiki; then
            echo "::error::Initialize the wiki with one page in the GitHub UI, then rerun this workflow"
            exit 1
          fi

      - name: Synchronize pages
        run: |
          find .wiki -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a docs/wiki/. .wiki/
          test -f .wiki/Home.md
          test -f .wiki/_Sidebar.md

      - name: Publish changes
        working-directory: .wiki
        run: |
          if git diff --quiet && test -z "$(git status --short)"; then
            echo "Wiki is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "docs: sync wiki from ${GITHUB_SHA}"
          git push origin HEAD
