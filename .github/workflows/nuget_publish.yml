name: Publish NuGet package

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore HDRezka.NET.slnx

      - name: Test
        run: dotnet test HDRezka.NET.slnx --configuration Release --no-restore

      - name: Pack
        shell: bash
        run: |
          PACKAGE_VERSION="${GITHUB_REF_NAME#v}"
          dotnet pack src/HDRezka.NET/HDRezka.NET.csproj \
            --configuration Release \
            --no-restore \
            --output artifacts \
            -p:PackageVersion="$PACKAGE_VERSION"

      - name: Authenticate with NuGet
        id: login
        uses: NuGet/login@v1
        with:
          user: freakdaniel

      - name: Publish
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source "https://api.nuget.org/v3/index.json"
          --skip-duplicate
